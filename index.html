<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e8e5dc" />
    <meta name="description" content="按下冲水，静静看水流过。一个可以反复体验的俯视马桶。" />
    <title>FLUSH — 水流过，归于平静</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app">
      <canvas
        id="scene"
        aria-label="白色陶瓷马桶的俯视三维场景，水箱按钮可冲水；摆放模式中可拖动排泄物，点选后用方向键微调，按住 Shift 加大步幅"
        tabindex="-1"
      ></canvas>
      <header class="header">
        <a class="wordmark" href="./" aria-label="FLUSH 首页">FLUSH<span>.</span></a>
        <div class="header-actions">
          <button class="lid-button" id="lid-toggle" type="button" aria-pressed="false" disabled>
            盖上马桶盖
          </button>
          <button
            class="sound-button is-muted"
            id="sound-toggle"
            type="button"
            aria-pressed="false"
            aria-label="开启声音"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <path d="M11 5 6 9H3v6h3l5 4V5Z" stroke-linejoin="round" />
              <path
                class="sound-waves"
                d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"
                stroke-linecap="round"
              />
              <path class="sound-off" d="m16 9 6 6m0-6-6 6" stroke-linecap="round" />
            </svg>
            <span id="sound-label">声音已关闭</span>
          </button>
        </div>
      </header>
      <div class="loading" id="loading" role="status">正在准备画面<span></span></div>
      <div class="experience">
        <div class="intro">
          <p class="eyebrow">A MOMENT OF QUIET</p>
          <h1>水流过，<br />归于平静。</h1>
          <p class="intro-note">轻轻一按，留给自己片刻空白。</p>
        </div>
        <div class="scene-frame" aria-hidden="true"></div>
        <section class="settings" aria-label="冲水体验设置">
          <fieldset id="strength-options" disabled>
            <legend>冲水力度 <span>座圈下沿出水</span></legend>
            <div class="strength-options">
              <label><input type="radio" name="strength" value="gentle" /><span>柔和</span></label>
              <label
                ><input type="radio" name="strength" value="standard" checked /><span
                  >标准</span
                ></label
              >
              <label><input type="radio" name="strength" value="strong" /><span>强劲</span></label>
            </div>
          </fieldset>
          <fieldset class="cleaner-options">
            <legend>水箱洁厕块 <span>在水箱中溶解</span></legend>
            <div class="color-options">
              <label
                ><input type="radio" name="cleaner" value="clear" /><span
                  ><i class="swatch clear"></i>无添加</span
                ></label
              >
              <label
                ><input type="radio" name="cleaner" value="blue" checked /><span
                  ><i class="swatch blue"></i>蓝色</span
                ></label
              >
              <label
                ><input type="radio" name="cleaner" value="mint" /><span
                  ><i class="swatch mint"></i>薄荷</span
                ></label
              >
              <label
                ><input type="radio" name="cleaner" value="lavender" /><span
                  ><i class="swatch lavender"></i>淡紫</span
                ></label
              >
            </div>
          </fieldset>
          <div class="excrement-section">
            <fieldset class="placement-options" id="placement-options" hidden disabled>
              <legend class="placement-heading">
                <span class="placement-title"
                  >编辑排泄物 <span id="piece-count" aria-live="polite">3 段</span></span
                >
              </legend>
              <div class="placement-toolbar">
                <select id="piece-select" aria-label="选择排泄物段落">
                  <option value="0">第 1 段</option>
                  <option value="1">第 2 段</option>
                  <option value="2">第 3 段</option>
                </select>
                <div class="piece-stepper" role="group" aria-label="增减数量">
                  <button
                    id="piece-remove"
                    type="button"
                    aria-label="删除选中段"
                    title="删除选中段"
                  >
                    −
                  </button>
                  <button id="piece-add" type="button" aria-label="添加一段" title="添加一段">
                    +
                  </button>
                </div>
              </div>
              <div class="placement-tabs" role="group" aria-label="编辑内容">
                <button
                  id="placement-tab-quantity"
                  type="button"
                  aria-pressed="true"
                  aria-controls="placement-quantity"
                >
                  数量
                </button>
                <button
                  id="placement-tab-position"
                  type="button"
                  aria-pressed="false"
                  aria-controls="placement-transform"
                >
                  摆放
                </button>
                <button
                  id="placement-tab-shape"
                  type="button"
                  aria-pressed="false"
                  aria-controls="placement-shape"
                >
                  形状
                </button>
              </div>
              <div class="placement-panel" id="placement-quantity">
                <div class="quantity-presets" role="group" aria-label="排泄物数量预设">
                  <button id="quantity-small" type="button" aria-pressed="false">少</button>
                  <button id="quantity-medium" type="button" aria-pressed="true">中</button>
                  <button id="quantity-large" type="button" aria-pressed="false">多</button>
                </div>
              </div>
              <p class="placement-empty placement-panel" id="placement-empty" hidden>
                便池已清空，选择数量或点击 + 添加
              </p>
              <div class="placement-panel" id="placement-transform" hidden>
                <div class="placement-range">
                  <label for="placement-rotation">旋转</label>
                  <input
                    id="placement-rotation"
                    type="range"
                    min="-180"
                    max="180"
                    step="1"
                    value="0"
                  />
                  <output id="placement-rotation-value" for="placement-rotation">0°</output>
                </div>
                <div class="placement-range">
                  <label for="placement-size">大小</label>
                  <input id="placement-size" type="range" min="65" max="130" step="1" value="100" />
                  <output id="placement-size-value" for="placement-size">100%</output>
                </div>
              </div>
              <div class="placement-panel" id="placement-shape" hidden>
                <div class="placement-shape-kind">
                  <label for="shape-kind">形态</label>
                  <select id="shape-kind">
                    <option value="log">长条</option>
                    <option value="curved">弯曲</option>
                    <option value="clump">团块</option>
                  </select>
                </div>
                <div class="placement-range">
                  <label for="shape-curvature">弯曲</label>
                  <input
                    id="shape-curvature"
                    type="range"
                    min="-100"
                    max="100"
                    step="1"
                    value="75"
                  />
                  <output id="shape-curvature-value" for="shape-curvature">75%</output>
                </div>
                <div class="placement-range">
                  <label for="shape-thickness">粗细</label>
                  <input
                    id="shape-thickness"
                    type="range"
                    min="65"
                    max="145"
                    step="1"
                    value="100"
                  />
                  <output id="shape-thickness-value" for="shape-thickness">100%</output>
                </div>
              </div>
            </fieldset>
            <div class="excrement-control">
              <div class="excrement-actions">
                <button
                  class="excrement-button"
                  id="excrement-add"
                  type="button"
                  aria-describedby="excrement-note"
                  disabled
                >
                  <svg
                    viewBox="0 0 20 20"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.3"
                    aria-hidden="true"
                  >
                    <path class="excrement-add-icon" d="M10 4v12M4 10h12" stroke-linecap="round" />
                    <path
                      class="excrement-done-icon"
                      d="m4 10 4 4 8-8"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                    <path
                      class="excrement-edit-icon"
                      d="m4 12 8-8 4 4-8 8H4v-4Zm6-6 4 4"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                  <span id="excrement-label">放入排泄物</span>
                </button>
                <button
                  class="mosaic-button"
                  id="excrement-mosaic"
                  type="button"
                  aria-label="排泄物马赛克"
                  aria-pressed="true"
                  title="用柔和模糊遮挡排泄物"
                  disabled
                >
                  <span>模糊马赛克</span>
                  <span class="mosaic-switch" aria-hidden="true"></span>
                </button>
              </div>
              <p class="excrement-note" id="excrement-note" role="status" aria-live="polite">
                放入一份，看看水流如何带走它
              </p>
            </div>
          </div>
        </section>
        <main class="controls" aria-label="冲水控制">
          <div class="cycle-status">
            <div class="phase-status">
              <span class="status-dot" id="status-dot"></span>
              <p id="phase-label" role="status" aria-live="polite">准备就绪</p>
            </div>
            <button
              class="boost-button"
              id="boost-toggle"
              type="button"
              aria-pressed="false"
              aria-label="Boost：冲完即可再冲"
              title="开启后，冲水结束即可再次冲水，无需等待补水"
              disabled
            >
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true">
                <path d="m9 1-6 8h4l-1 6 7-9H9l1-5Z" stroke-linejoin="round" />
              </svg>
              Boost
            </button>
          </div>
          <button class="flush-button" id="flush-button" type="button" disabled>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <path
                d="M12 3C9.5 6.5 5.5 10.7 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 10.7 14.5 6.5 12 3Z"
                stroke-linejoin="round"
              />
              <path d="M9 15a3 3 0 0 0 3 3" stroke-linecap="round" />
            </svg>
            <span id="flush-label">冲水</span>
            <kbd>空格</kbd>
          </button>
          <div class="tank-status">
            <span id="tank-label">水箱已蓄满</span>
            <div
              class="tank-meter"
              id="tank-meter"
              role="progressbar"
              aria-label="水箱储水量"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="100"
            >
              <span id="tank-fill"></span>
            </div>
          </div>
        </main>
      </div>
      <footer class="footer">
        <span>一个小小的水循环</span><span>点击水箱按钮也可以冲水</span>
      </footer>
      <noscript><p class="error-message">请启用 JavaScript 以体验冲水动画。</p></noscript>
    </div>
    <dialog
      class="sound-dialog"
      id="sound-dialog"
      aria-labelledby="sound-dialog-title"
      aria-describedby="sound-dialog-description"
    >
      <div class="sound-dialog-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
          <path d="M11 5 6 9H3v6h3l5 4V5Z" stroke-linejoin="round" />
          <path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" stroke-linecap="round" />
        </svg>
      </div>
      <h2 id="sound-dialog-title">要开启水声吗？</h2>
      <p id="sound-dialog-description">
        声音默认关闭。开启后，可以听见冲水与补水的声音，也可随时在右上角切换。
      </p>
      <label class="sound-remember">
        <input id="sound-remember" type="checkbox" />
        <span>下次不再提示</span>
      </label>
      <div class="sound-dialog-actions">
        <button id="sound-keep-muted" class="sound-dialog-secondary" type="button" autofocus>
          保持静音
        </button>
        <button id="sound-enable" class="sound-dialog-primary" type="button">开启声音</button>
      </div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
